<style>
/* 레이아웃: 차 자체가 화면이다. 위에서 본 캠핑카 안에 조명과 가전을 제자리에 두고 눌러서 켠다. 오른쪽에 배터리·물·문 상태, 아래에 장면과 전체 스위치. */
:root{
  --bg:#F5F5F3; --panel:#FFFFFF; --ink:#1B1D1F; --muted:#6E7377; --line:#E3E4E2;
  --van:#F1F1EF; --van-line:#A9ADB0; --accent:#1B1D1F;
  --lamp:#F5B700; --lamp-glow:rgba(255,205,40,.6); --lamp-bg:#FFF3C4; --lamp-line:#EFCB4A; --mint:#1B1D1F;
  --ok:#1E8E5A; --warn:#C8501A; --water:#4A90C8; --grey:#9B9A86;
  --topo:rgba(0,0,0,.05); --on-bg:#1B1D1F; --on-bg-muted:#6E7377; --on-lamp:#FFFFFF;
  --f-head:'Space Grotesk','Noto Sans KR',system-ui,sans-serif;
  --f-body:Inter,'Noto Sans KR',system-ui,sans-serif;
}

body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;position:relative}
.topo{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none}
.topo path{fill:none;stroke:var(--topo);stroke-width:1.2}
.wrap{position:relative;z-index:1}
.wrap{max-width:1200px;margin:0 auto;padding-block:24px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:18px}
button{font-family:inherit;color:inherit}
button:focus-visible,[role="button"]:focus-visible{outline:3px solid var(--water);outline-offset:2px}

header{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:10px 20px}
h1{margin:0;color:var(--on-bg);font:700 clamp(26px,4vw,34px)/1.1 var(--f-head);letter-spacing:-.01em}
.where{margin:0 0 2px;color:var(--on-bg-muted);font-size:13px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.theme-btn{cursor:pointer;font:inherit;font-size:12.5px}
.theme-btn svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.theme-btn .i-sun{display:none}
.dark-on .theme-btn .i-sun{display:inline}.dark-on .theme-btn .i-moon{display:none}

.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:999px;border:1px solid var(--on-bg-muted);background:transparent;color:var(--on-bg);font-size:12.5px}
.pill i{width:7px;height:7px;border-radius:50%;background:var(--ok)}
.pill.sample{border-color:var(--lamp-line);background:var(--lamp-bg)}.pill.sample i{background:var(--lamp)}
.pill.sample i{background:var(--lamp)}

.main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:860px){.main{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--panel);border-radius:20px;padding:18px 20px;min-width:0}
.stage{padding:14px 14px 10px}
.stage-top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:4px 6px 8px}
h2{margin:0;font:600 15px var(--f-head)}
.hint{color:var(--muted);font-size:12.5px}
.stage-top .hint{text-align:right;margin-left:16px}
.hint.msg{color:var(--ink);font-weight:600}
.scroll{overflow-x:auto}
svg.van{display:block;width:100%;min-width:600px;height:auto}
.body{fill:var(--van);stroke:var(--van-line);stroke-width:2}
.ln{fill:none;stroke:var(--van-line);stroke-width:1.5}
.furn{fill:var(--panel);stroke:var(--van-line);stroke-width:1.2}
.zt{fill:var(--muted);font:500 11px var(--f-body);letter-spacing:.06em}
.dim{fill:none;stroke:var(--van-line);stroke-width:1}
.dev{cursor:pointer}
.dev .glow{opacity:0;transition:opacity .25s}
.dev.on .glow{opacity:1}
.dev .dot{fill:var(--panel);stroke:var(--van-line);stroke-width:2;transition:fill .15s,stroke .15s}
.dev.on .dot{fill:var(--lamp);stroke:var(--lamp)}
.dev text{fill:var(--ink);font:600 12.5px var(--f-body);text-anchor:middle}
.dev .hit{fill:transparent}
.dev .mi{fill:none;stroke:var(--ink);stroke-width:2.1;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
.dev.on .mi{stroke:#1B1D1F}
.dev .glowl{fill:none;stroke:var(--lamp-glow);stroke-width:26;stroke-linecap:round}
.dev .barl{fill:none;stroke:var(--van-line);stroke-width:5;stroke-linecap:round;transition:stroke .15s}
.dev.on .barl{stroke:var(--lamp)}
@media (prefers-reduced-motion:reduce){.dev .glow,.dev .dot{transition:none}}

.side{display:flex;flex-direction:column;gap:18px}
.batt-row{display:flex;align-items:baseline;gap:6px}
.big{font:700 60px/1 var(--f-head);font-variant-numeric:tabular-nums}
.unit{font:500 22px var(--f-head);color:var(--muted)}
.flow{margin-left:auto;text-align:right;font-size:13px;font-weight:600}
.flow.pos{color:var(--ok)}.flow.neg{color:var(--warn)}
.bar{position:relative;height:10px;border-radius:5px;background:var(--line);margin-top:12px}
.bar>div{position:absolute;inset:0 auto 0 0;border-radius:5px;background:var(--accent)}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.kv div{display:flex;flex-direction:column;gap:1px}
.kv span{font-size:12px;color:var(--muted)}
.kv strong{font:600 17px var(--f-head);font-variant-numeric:tabular-nums}
.tanks{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:12px}
.tank{display:flex;gap:14px;align-items:center;min-width:0}
.ring{width:96px;height:96px;flex:none}
.ring circle{fill:none;stroke-width:9}
.rt{stroke:var(--line)}
.rv{stroke-linecap:round;transform:rotate(-90deg);transform-origin:50px 50px}
.ring text{fill:var(--ink);font:700 22px var(--f-head)}
.tank strong{display:block;font:700 24px/1.15 var(--f-head);font-variant-numeric:tabular-nums;white-space:nowrap}
.tank span{display:block;font-size:12.5px;color:var(--muted)}
.tank small{display:block;font-size:12px;color:var(--muted);white-space:nowrap}
.pair{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.pair strong{display:block;font:600 20px var(--f-head);margin-top:2px}
.pair span{font-size:12.5px;color:var(--muted)}

.scenes{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.scene{min-height:54px;border-radius:16px;border:1px solid var(--line);background:var(--panel);font-size:15px;font-weight:600;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}
.scene{flex-direction:row;gap:12px}
.scene span{display:flex;flex-direction:column;align-items:flex-start;gap:1px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.scene .ic{width:24px;height:24px}
.sw .ic{width:34px;height:34px;stroke-width:1.5;color:var(--muted)}
.sw[aria-pressed="true"]{background:var(--lamp-bg);border-color:var(--lamp-line)}
.sw[aria-pressed="true"] .ic{color:var(--ink)}
.scene small{font-weight:400;font-size:11.5px;color:var(--muted)}
.scene[aria-pressed="true"]{background:var(--mint);border-color:var(--mint);color:var(--on-lamp)}
.scene[aria-pressed="true"] small{color:inherit;opacity:.85}
.switches{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(98px,1fr);gap:8px;overflow-x:auto;padding-bottom:2px}
.sw{padding:12px 6px;border-radius:16px;border:1px solid var(--line);background:var(--panel);text-align:center;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.sw b{font-size:14px;font-weight:600;white-space:nowrap;line-height:20px;height:20px}
.tg{width:44px;height:26px;border-radius:13px;background:var(--van-line);position:relative;transition:background .15s}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.3);transition:transform .15s}
.sw[aria-pressed="true"] .tg{background:var(--lamp)}
.sw[aria-pressed="true"] .tg::after{transform:translateX(18px)}
@media (prefers-reduced-motion:reduce){.tg,.tg::after{transition:none}}
.sw small{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.sw[aria-pressed="true"] small{color:var(--ink)}
.status{min-height:20px;margin:0;color:var(--on-bg-muted);font-size:13px}
/* 도면 스타일 덮어쓰기: 흰 종이, 모눈, 가는 선, 각진 테두리, 고정폭 라벨 */
:root{
  --bg:#FFFFFF; --panel:#FFFFFF; --ink:#12161B; --muted:#5A636E; --line:#C8CDD5;
  --van:#FFFFFF; --van-line:#2A323D; --accent:#1F4FBF; --mint:#12161B; --on-lamp:#FFFFFF;
  --on-bg:#12161B; --on-bg-muted:#5A636E;
  --grid:rgba(31,79,191,.06); --grid-major:rgba(31,79,191,.13);
  --f-mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
:root[data-theme="dark"]{
  --bg:#0E1726; --panel:#121D2F; --ink:#E8EEF7; --muted:#8C9AB0; --line:#2A3A55;
  --van:#121D2F; --van-line:#B8C6DC; --accent:#7FA8FF; --mint:#E8EEF7; --on-lamp:#0E1726;
  --on-bg:#E8EEF7; --on-bg-muted:#8C9AB0;
  --lamp:#FFD84D; --lamp-glow:rgba(255,216,77,.4); --lamp-bg:#3D3720; --lamp-line:#8F7A22;
  --ok:#4CC98A; --warn:#FF9A6B; --water:#6FB2E6; --grey:#B9B8A2;
  --grid:rgba(127,168,255,.07); --grid-major:rgba(127,168,255,.15); color-scheme:dark}
body{background-color:var(--bg);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid-major) 1px,transparent 1px),linear-gradient(90deg,var(--grid-major) 1px,transparent 1px);
  background-size:20px 20px,20px 20px,100px 100px,100px 100px}
header{border-bottom:2px solid var(--ink);padding-bottom:12px}
.where{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em}
.card,.scene,.sw{border-radius:0;border:1px solid var(--ink)}
.tg{border-radius:3px}.tg::after{border-radius:2px}
.pill{border-radius:0;font-family:var(--f-mono);font-size:11.5px;border-color:var(--ink)}
h2{font:600 12px var(--f-mono);letter-spacing:.14em;color:var(--accent)}
.hint,.kv span,.tank span,.pair span,.sw small,.scene small{font-family:var(--f-mono);font-size:11.5px}
.bar,.bar>div,.tube{border-radius:0}
.rv{stroke-linecap:butt}.rt{stroke:var(--line)}.tank small{font-family:var(--f-mono);font-size:11.5px}
.body{fill:none;stroke-width:1.6}
.furn{fill:none;stroke-width:1.1}
.ln{stroke-width:1.1}
.zt{fill:var(--accent);font-family:var(--f-mono)}
.dim{stroke:var(--accent)}
.dev text{font-family:var(--f-mono);font-size:11.5px}
.dev .dot{fill:var(--bg);stroke:var(--van-line);stroke-width:1.5}
.b-head{display:flex;justify-content:space-between;align-items:center;gap:10px}
.chip{font-size:12.5px;font-weight:600;padding:3px 10px;border-radius:999px;border:1px solid currentColor}
.chip.pos{color:var(--ok)}.chip.neg{color:var(--warn)}
.b-main{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-top:10px}
.b-sub{margin:0;text-align:right;font-size:12.5px;color:var(--muted);line-height:1.5}
.b-sub strong{color:var(--ink);font:600 16px var(--f-head);font-variant-numeric:tabular-nums}
.cells{display:grid;grid-template-columns:repeat(10,minmax(0,1fr));gap:4px;margin-top:14px}
.cells i{height:14px;border-radius:4px;background:var(--line)}
.cells i.on{background:var(--ok)}
.pflow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));margin-top:16px;border-radius:14px;border:1px solid var(--line)}
.node{display:flex;align-items:center;gap:10px;padding:12px;min-width:0}
.node+.node{border-left:1px solid var(--line)}
.node svg{width:26px;height:26px;flex:none;fill:none;stroke:var(--ink);stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.node.sun svg{stroke:var(--lamp)}
.node div{display:flex;flex-direction:column;gap:1px;min-width:0}
.node span{font-size:12px;color:var(--muted)}
.node strong{font:600 17px var(--f-head);font-variant-numeric:tabular-nums;white-space:nowrap}
.b-foot{display:flex;flex-wrap:wrap;gap:4px 16px;margin-top:12px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.b-foot b{color:var(--ink);font-weight:600}
.pflow,.cells i,.chip{border-radius:0}
.b-foot,.b-sub,.node span,.chip{font-family:var(--f-mono)}
.main{align-items:stretch}
.stage{display:flex;flex-direction:column}
.stage .scroll{flex:1;display:flex;align-items:center}
.stage .scroll svg{flex:1}
.side .card:last-child{flex:1}
#door{cursor:pointer}
#door .hit{fill:transparent}
.door-gap{fill:none;stroke:var(--panel);stroke-width:6;opacity:0}
.door-leaf{fill:none;stroke:var(--van-line);stroke-width:5;stroke-linecap:round;transition:transform .3s,stroke .15s}
#door.open .door-gap{opacity:1}
#door.open .door-leaf{transform:translate(-150px,8px);stroke:var(--warn)}
.zt.warn-t{fill:var(--warn);font-weight:700}
.tval{fill:var(--ink);font:700 30px var(--f-head)}
.tbadge rect{fill:var(--panel);stroke:var(--van-line);stroke-width:1.2}
.tb-s{fill:var(--ink);font:600 13px var(--f-body)}
.lv{fill:var(--ink);font:700 17px var(--f-head)}
.lv-ring{fill:none;stroke:var(--van-line);stroke-width:1.2}
.lv-dot{fill:var(--accent)}
.obadge rect{fill:var(--panel);stroke:var(--van-line);stroke-width:1.2}
.obadge .lv{font-size:23px}
@media (prefers-reduced-motion:reduce){.door-leaf{transition:none}}
</style>

(()=>{const r=document.documentElement,b=document.getElementById('themeBtn');

        <text class="zt" x="24" y="452">단위 mm</text>
        <path class="dim" d="M534 130 V352 M526 130 H542 M526 352 H542 M530 134 l8 -8 M530 356 l8 -8"/>
        <text class="zt" x="524" y="241" text-anchor="middle" transform="rotate(-90 524 241)">실내폭 1,050</text>
        <g id="devs"></g>
      </svg>
      </div>
    </section>

    <div class="side">
      <section class="card batt" aria-label="배터리">
        <div class="b-head"><h2>배터리</h2><span class="chip" id="flow"></span></div>
        <div class="b-main">
          <div class="batt-row"><span class="big">80</span><span class="unit">%</span></div>
          <p class="b-sub"><strong>480 Ah</strong> 남음 · 전체 600 Ah<br><span id="eta"></span></p>
        </div>
        <div class="cells" role="img" aria-label="배터리 잔량 80%"><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i class="on"></i><i></i><i></i></div>
        <div class="pflow">
          <div class="node sun"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg><div><span>태양광</span><strong>180 W</strong></div></div>
          <div class="node"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="17" height="10" rx="2"/><path d="M22 10.5v3M11 9.3l-2.2 2.7h3.6l-2.2 2.7"/></svg><div><span>배터리</span><strong id="net"></strong></div></div>
          <div class="node"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 2v5M15 2v5M6 7h12v4a6 6 0 0 1-12 0zM12 17v5"/></svg><div><span>사용</span><strong id="load">0 W</strong></div></div>
        </div>
        <div class="b-foot"><span>전압 <b>13.2 V</b></span><span>전류 <b id="amp"></b></span><span>배터리 온도 <b>18°</b></span></div>
      </section>
      <section class="card" aria-label="물">
        <h2>물</h2>
        <div class="tanks">
          <div class="tank"><svg class="ring" viewBox="0 0 100 100" role="img" aria-label="청수 62%, 37리터"><circle class="rt" cx="50" cy="50" r="42"/><circle class="rv" cx="50" cy="50" r="42" pathLength="100" stroke-dasharray="62 100" style="stroke:var(--water)"/><text x="50" y="58" text-anchor="middle">62%</text></svg><div><span>청수</span><strong>37 L</strong><small>전체 60 L</small></div></div>
          <div class="tank"><svg class="ring" viewBox="0 0 100 100" role="img" aria-label="오수 35%, 11리터"><circle class="rt" cx="50" cy="50" r="42"/><circle class="rv" cx="50" cy="50" r="42" pathLength="100" stroke-dasharray="35 100" style="stroke:var(--grey)"/><text x="50" y="58" text-anchor="middle">35%</text></svg><div><span>오수</span><strong>11 L</strong><small>전체 30 L</small></div></div>
        </div>
      </section>
    </div>
  </div>

  <section aria-label="장면" class="scenes" id="scenes"></section>
  <section aria-label="전체 스위치" class="switches" id="switches"></section>
</div>

<script>
// k, 이름, 소비전력(W, 예시), 평면 위치(x,y), 조명 여부
const DEV=[
 ['ceil','천장등',18,440,232,1],['l1','조명1',8,90,103,1],['l2','조명2',8,340,352,1,[{t:'line',x1:60,x2:545,y:68},{t:'line',x1:60,x2:384,y:362}]],['l3','조명3',8,182,186,1,[{t:'pin',x:182,y:158},{t:'pin',x:432,y:158},{t:'pin',x:182,y:328},{t:'pin',x:432,y:328}]],
 ['awning','어닝등',12,420,438,1,[{t:'line',x1:280,x2:560,y:410}]],['fridge','냉장고',45,495,103,0],['pump','물펌프',30,365,103,0],
 ['tv','TV',40,435,103,0],['usb','USB',10,245,103,0],['inv','인버터',25,90,172,0]];
const IC={
 ceil:'<path d="M12 3v4M5 15a7 7 0 0 1 14 0zM10 18.5a2 2 0 0 0 4 0"/>',
 l1:'<path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
 l2:'<rect x="3" y="8" width="18" height="4" rx="2"/><path d="M6 15.5v2.5M12 15.5v3.5M18 15.5v2.5"/>',
 l3:'<circle cx="12" cy="12" r="3.5"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M6 18l1.4-1.4M16.6 7.4L18 6"/>',
 awning:'<path d="M3 6h18l-2 6H5zM5.5 12v8M18.5 12v8"/>',
 fridge:'<rect x="6" y="2.5" width="12" height="19" rx="2"/><path d="M6 10h12M9.5 5.5v2M9.5 13v3"/>',
 pump:'<path d="M12 3c3.5 4.5 6 7.3 6 10.5a6 6 0 0 1-12 0C6 10.3 8.5 7.5 12 3z"/>',
 tv:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
 usb:'<path d="M8.5 8V3h7v5M6.5 8h11v6a3 3 0 0 1-3 3h-5a3 3 0 0 1-3-3zM12 17v4"/>',
 inv:'<circle cx="12" cy="12" r="9"/><path d="M7 12c1.5-4 3.5-4 5 0s3.5 4 5 0"/>',
 arrive:'<path d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',
 sleep:'<path d="M20 14.500A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
 away:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 off:'<path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/>'};
const ico=k=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
const SCENES=[
 ['arrive','도착','불 켜고 물 준비',{ceil:1,l1:1,l3:1,pump:1,usb:1,fridge:1}],
 ['sleep','취침','조명·TV·펌프 끔',{ceil:0,l1:0,l2:0,l3:0,awning:0,tv:0,pump:0}],
 ['away','외출','냉장고만 남김',{ceil:0,l1:0,l2:0,l3:0,awning:0,tv:0,pump:0,usb:0,inv:0,fridge:1}],
 ['off','모두 끄기','전부 끔',Object.fromEntries(DEV.map(d=>[d[0],0]))]];
const st={sw:{ceil:1,l1:1,fridge:1,usb:1,pump:1},scene:'',arm:0,door:false};
const $=id=>document.getElementById(id), NS='http://www.w3.org/2000/svg';
let idle='',msgT=0;
const say=t=>{const e=$('status');e.textContent=t;e.classList.add('msg');clearTimeout(msgT);msgT=setTimeout(()=>{e.classList.remove('msg');e.textContent=idle},4000)};

function toggle(k){
  const d=DEV.find(x=>x[0]===k), on=!!st.sw[k];
  if(k==='inv'&&!on&&st.arm!==1){st.arm=1;say('인버터는 한 번 더 누르면 켜집니다.');setTimeout(()=>{st.arm=0},4000);return}
  st.arm=0;st.sw[k]=on?0:1;st.scene='';say(d[1]+(on?' 껐습니다.':' 켰습니다.'));render();
}
function run(id){const s=SCENES.find(x=>x[0]===id);Object.assign(st.sw,s[3]);st.scene=id;say(s[1]+' 장면: '+s[2]+'.');render()}

function build(){
  const g=$('devs');
  DEV.forEach(([k,n,w,x,y,lamp,sh])=>{
    const e=document.createElementNS(NS,'g');e.setAttribute('class','dev');e.dataset.k=k;e.setAttribute('role','button');e.setAttribute('tabindex','0');
    e.innerHTML=sh?sh.map(s=>s.t==='line'?`<path class="glow glowl" d="M${s.x1} ${s.y} H${s.x2}"/><path class="barl" d="M${s.x1} ${s.y} H${s.x2}"/><rect class="hit" x="${s.x1}" y="${s.y-12}" width="${s.x2-s.x1}" height="24"/>`:`<circle class="glow" cx="${s.x}" cy="${s.y}" r="46" fill="url(#glow)"/><circle class="dot" cx="${s.x}" cy="${s.y}" r="7"/><rect class="hit" x="${s.x-18}" y="${s.y-18}" width="36" height="36"/>`).join('')+`<text x="${x}" y="${y}">${n}</text>`:(lamp?`<circle class="glow" cx="${x}" cy="${y}" r="78" fill="url(#glow)"/>`:'')+
      `<circle class="dot" cx="${x}" cy="${y}" r="14"/><g class="mi" transform="translate(${x-9} ${y-9}) scale(.75)">${IC[k]}</g>`+
      `<text x="${x}" y="${y+28}">${n}</text><rect class="hit" x="${x-34}" y="${y-22}" width="68" height="58"/>`;
    e.addEventListener('click',()=>toggle(k));
    e.addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggle(k)}});
    if(x!=null)g.appendChild(e);
    const b=document.createElement('button');b.type='button';b.className='sw';b.id='sw-'+k;b.dataset.k=k;
    b.innerHTML=`${ico(k)}<b>${n}</b><small></small>`;b.addEventListener('click',()=>toggle(k));$('switches').appendChild(b);
  });
  SCENES.forEach(([id,label,desc])=>{
    const b=document.createElement('button');b.type='button';b.className='scene';b.id='sc-'+id;
    b.innerHTML=`${ico(id)}<span>${label}<small>${desc}</small></span>`;b.addEventListener('click',()=>run(id));$('scenes').appendChild(b);
  });
}
function render(){
  let load=0,n=0;
  DEV.forEach(([k,name,w])=>{
    const on=!!st.sw[k];if(on){load+=w;n++}
    const e=document.querySelector(`.dev[data-k="${k}"]`);if(e){e.classList.toggle('on',on);e.setAttribute('aria-pressed',on);e.setAttribute('aria-label',name+(on?' 켜짐':' 꺼짐'))}
    const b=$('sw-'+k);b.setAttribute('aria-pressed',on);b.querySelector('small').textContent=on?`켜짐 · ${w} W`:'꺼짐';
  });
  SCENES.forEach(s=>$('sc-'+s[0]).setAttribute('aria-pressed',st.scene===s[0]));
  const net=180-load,f=$('flow'),amp=net/13.2,sign=net>=0?'+':'−';
  f.textContent=net>=0?'충전 중':'방전 중';f.className='chip '+(net>=0?'pos':'neg');
  $('net').textContent=sign+Math.abs(net)+' W';$('amp').textContent=sign+Math.abs(amp).toFixed(1)+' A';
  const h=net>0?120/amp:net<0?480/-amp:0, hrs=h>=48?Math.round(h/24)+'일':Math.round(h)+'시간';
  $('eta').textContent=net>0?`이대로면 약 ${hrs} 뒤 가득 참`:net<0?`이대로면 약 ${hrs} 사용 가능`:'들어오는 만큼 쓰는 중';
  $('load').textContent=load+' W';
  const dg=$('door');dg.classList.toggle('open',st.door);dg.setAttribute('aria-label','슬라이드 도어 '+(st.door?'열림':'닫힘'));
  const dt=$('doorText');dt.textContent='슬라이드 도어 · '+(st.door?'열림':'닫힘');dt.classList.toggle('warn-t',st.door);idle=n?`${n}개 켜짐 · 눌러서 켜고 끄기`:'모두 꺼짐';if(!$('status').classList.contains('msg'))$('status').textContent=idle;
}
function toggleDoor(){st.door=!st.door;say('예시: 슬라이드 도어를 '+(st.door?'열림':'닫힘')+'으로 바꿨습니다. 실제로는 도어 센서가 알려 줍니다.');render()}
build();
$('door').addEventListener('click',toggleDoor);
$('door').addEventListener('keydown',ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggleDoor()}});
render();
</script>

<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Eurovan Home iPhone</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* 아이폰 화면용 (iPhone 17 Pro 기준 402×874pt, 18 Pro도 같다고 가정). 스크롤 없이 한 화면. 아래 탭으로 상태 / 제어 전환. */
:root{
  --bg:#F2F2F0; --panel:#FFFFFF; --ink:#1B1D1F; --muted:#6E7377; --line:#E3E4E2;
  --van:#F1F1EF; --van-line:#A9ADB0;
  --lamp:#F5B700; --lamp-glow:rgba(255,205,40,.6); --lamp-bg:#FFF3C4; --lamp-line:#EFCB4A;
  --ok:#1E8E5A; --warn:#C8501A; --water:#4A90C8; --grey:#9B9A86;
  --alert:#C8501A; --frame:#D9D9D6; --desk:#E7E7E4; --toast:#1B1D1F; --toast-ink:#FFFFFF;
  --f-head:'Space Grotesk','Noto Sans KR',system-ui,sans-serif;
  --f-body:Inter,'Noto Sans KR',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F1011; --panel:#1C1E20; --ink:#F1F2F2; --muted:#9A9FA3; --line:#2C2F32;
  --van:#232628; --van-line:#5E6468;
  --lamp:#FFD84D; --lamp-glow:rgba(255,216,77,.45); --lamp-bg:#4A431F; --lamp-line:#8F7A22;
  --ok:#4CC98A; --warn:#FF9A6B; --water:#6FB2E6; --grey:#B9B8A2;
  --frame:#2E3134; --desk:#18191A; --toast:#F1F2F2; --toast-ink:#121314; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1011; --panel:#1C1E20; --ink:#F1F2F2; --muted:#9A9FA3; --line:#2C2F32;
  --van:#232628; --van-line:#5E6468;
  --lamp:#FFD84D; --lamp-glow:rgba(255,216,77,.45); --lamp-bg:#4A431F; --lamp-line:#8F7A22;
  --ok:#4CC98A; --warn:#FF9A6B; --water:#6FB2E6; --grey:#B9B8A2;
  --frame:#2E3134; --desk:#18191A; --toast:#F1F2F2; --toast-ink:#121314; color-scheme:dark}

*{box-sizing:border-box;margin:0}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;min-height:100vh;display:flex;justify-content:center;align-items:flex-start;padding:32px 16px}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid var(--water);outline-offset:2px}

.phone{width:422px;max-width:100%;height:894px;border-radius:52px;border:10px solid var(--frame);background:var(--bg);overflow:hidden;position:relative;box-shadow:0 30px 60px rgba(0,0,0,.18)}
.screen{position:absolute;inset:54px 0 83px;overflow-y:auto;padding:4px 16px 12px;scrollbar-width:none;display:flex;flex-direction:column;gap:10px}
.screen[hidden]{display:none}
.screen::-webkit-scrollbar{display:none}
.sbar{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;justify-content:space-between;align-items:center;height:54px;padding:4px 30px 0;font:600 15px var(--f-body)}
.island{position:absolute;left:50%;top:11px;transform:translateX(-50%);width:118px;height:32px;border-radius:20px;background:#000;z-index:6}
.sbar i{font-style:normal;font-size:12px;letter-spacing:.04em}
@media (max-width:440px){body{padding:0;background:var(--bg)}.phone{border:0;border-radius:0;height:100vh;height:100dvh;box-shadow:none;width:100%}.island,.sbar{display:none}.screen{top:env(safe-area-inset-top,12px)}}

.top{display:flex;justify-content:space-between;align-items:flex-end;padding:2px 2px 2px}
.where{font-size:12.5px;color:var(--muted)}
h1{font:700 28px/1.1 var(--f-head);letter-spacing:-.01em}
.round{width:38px;height:38px;border-radius:50%;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.round .ic{width:18px;height:18px}

.alert{display:none;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:var(--alert);color:#fff;font-weight:600}
.alert.show{display:flex}
.alert .ic{width:20px;height:20px}

.card{background:var(--panel);border-radius:22px;padding:14px 16px;border:1px solid var(--line)}
.sec{font:600 13px var(--f-body);color:var(--muted);margin:4px 4px -4px;letter-spacing:.02em;display:flex;justify-content:space-between}
.sec span{font-weight:500}

.bat-top{display:flex;justify-content:space-between;align-items:flex-start}
.label{font-size:13px;color:var(--muted);font-weight:500}
.big{font:700 48px/1 var(--f-head);letter-spacing:-.02em;margin-top:2px}
.big small{font-size:22px;color:var(--muted);margin-left:2px}
.chip{font-size:12px;font-weight:600;padding:4px 10px;border-radius:999px;border:1.5px solid var(--ok);color:var(--ok)}
.sub{font-size:13px;color:var(--muted);margin-top:6px}
.sub b{color:var(--ink);font-weight:600}
.cells{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;margin:10px 0 12px}
.cells i{height:10px;border-radius:3px;background:var(--line)}
.cells i.on{background:var(--ok)}
.flow{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid var(--line);padding-top:12px}
.flow div{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11.5px;color:var(--muted)}
.flow div+div{border-left:1px solid var(--line)}
.flow strong{font:600 16px var(--f-head);color:var(--ink);font-variant-numeric:tabular-nums}
.flow .sun{color:var(--lamp)}

.grid2{display:grid;grid-template-columns:1fr 1fr;grid-auto-rows:1fr;gap:10px;flex:1;min-height:0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:10px 14px;min-height:0;gap:4px;display:flex;flex-direction:column;justify-content:space-between;text-align:left}
.tile .v{font:700 24px/1.05 var(--f-head);font-variant-numeric:tabular-nums}
.tile .v small{font-size:14px;color:var(--muted);font-weight:600}
.tile .s{font-size:12px;color:var(--muted)}
.tile-h{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);font-weight:500}
.ring{width:34px;height:34px}
.ring circle{fill:none;stroke-width:5}
.ring .rt{stroke:var(--line)}
.ring .rv{stroke-linecap:round;transform:rotate(-90deg);transform-origin:20px 20px}
.tile.door.open{background:var(--alert);border-color:var(--alert);color:#fff}
.tile.door.open .tile-h,.tile.door.open .s{color:rgba(255,255,255,.85)}
.lv{width:34px;height:34px}
.lv circle,.lv path{fill:none;stroke:var(--van-line);stroke-width:1.2}
.lv .dot{fill:var(--ink);stroke:none}

.scenes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.scene{display:flex;flex-direction:column;align-items:center;gap:5px;padding:10px 4px;border-radius:18px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;font-weight:600}
.scene[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}

.devs{display:grid;grid-template-columns:repeat(4,1fr);grid-auto-rows:1fr;gap:8px;flex:1;min-height:0}
.dev{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;padding:8px 4px;border-radius:18px;background:var(--panel);border:1px solid var(--line);text-align:center;min-height:0;transition:background .15s,border-color .15s}
.dev .ic{width:28px;height:28px;color:var(--muted)}
.dev b{display:block;font-size:13px;font-weight:600;white-space:nowrap}
.dev small{display:block;font-size:11px;white-space:nowrap;color:var(--muted);font-variant-numeric:tabular-nums}
.dev[aria-pressed="true"]{background:var(--lamp-bg);border-color:var(--lamp-line)}
.dev[aria-pressed="true"] .ic{color:var(--ink)}
.dev[aria-pressed="true"] small{color:var(--ink)}
.dev.arm{border-color:var(--warn)}

.map{padding:8px 8px 6px}
.map svg{width:100%;height:auto;display:block}
.m-body{fill:var(--van);stroke:var(--van-line);stroke-width:2}
.m-ln{fill:none;stroke:var(--van-line);stroke-width:1.5}
.m-dot{fill:var(--panel);stroke:var(--van-line);stroke-width:2.5;transition:fill .15s,stroke .15s}
.m-bar{fill:none;stroke:var(--van-line);stroke-width:6;stroke-linecap:round}
.m-glow{opacity:0;transition:opacity .25s}
.on .m-dot{fill:var(--lamp);stroke:var(--lamp)}
.on .m-bar{stroke:var(--lamp)}
.on .m-glow{opacity:1}
.m-door{fill:none;stroke:var(--van-line);stroke-width:6;stroke-linecap:round;transition:transform .3s,stroke .15s}
.door-open .m-door{transform:translate(-150px,10px);stroke:var(--warn)}
.map-cap{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:6px 8px 2px}

.tabs{position:absolute;left:0;right:0;bottom:0;height:83px;display:grid;grid-template-columns:repeat(4,1fr);padding:8px 8px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);z-index:4}
.tabs button{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;color:var(--muted)}
.tabs button[aria-selected="true"]{color:var(--ink);font-weight:600}
.tabs .ic{width:24px;height:24px}

.toast{position:absolute;left:50%;top:60px;transform:translate(-50%,-14px);opacity:0;pointer-events:none;background:var(--toast);color:var(--toast-ink);font-size:13px;font-weight:600;padding:9px 16px;border-radius:999px;white-space:nowrap;z-index:5;transition:opacity .2s,transform .2s}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ex{color:var(--ink);font-weight:600}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="phone">
  <div class="island" aria-hidden="true"></div>
    <div class="sbar" aria-hidden="true"><span>9:41</span><i>LTE ▮▮▮ 80%</i></div>

    <div class="top">

      <p class="sub"><b>480 Ah</b> 남음 · <span id="eta"></span></p>

    <h2 class="sec">상태</h2>

      <div class="tile"><div class="tile-h">실내</div><div><p class="v">21.8°</p><p class="s">습도 46%</p></div></div>
      <div class="tile"><div class="tile-h">외부</div><div><p class="v">4.2°</p><p class="s">밤사이 영하 가능</p></div></div>

  </div>

  <div class="screen" id="pane-ctrl" role="tabpanel" aria-labelledby="tab-ctrl" hidden>

      <button class="round themeBtn" type="button" aria-label="다크 모드로 전환"></button>

<script>
const IC={
 ceil:'<path d="M12 3v4M5 15a7 7 0 0 1 14 0zM10 18.5a2 2 0 0 0 4 0"/>',
 l1:'<path d="M9.5 18h5M10.5 21h3M12 3a6 6 0 0 0-4 10.5c.7.7 1 1.5 1 2.5h6c0-1 .3-1.8 1-2.5A6 6 0 0 0 12 3z"/>',
 l2:'<rect x="3" y="8" width="18" height="4" rx="2"/><path d="M6 15.5v2.5M12 15.5v3.5M18 15.5v2.5"/>',
 l3:'<circle cx="12" cy="12" r="3.5"/><path d="M12 3.5v2M12 18.5v2M3.5 12h2M18.5 12h2M6 6l1.4 1.4M16.6 16.6L18 18M6 18l1.4-1.4M16.6 7.4L18 6"/>',
 awning:'<path d="M3 6h18l-2 6H5zM5.5 12v8M18.5 12v8"/>',
 fridge:'<rect x="6" y="2.5" width="12" height="19" rx="2"/><path d="M6 10h12M9.5 5.5v2M9.5 13v3"/>',
 pump:'<path d="M12 3c3.5 4.5 6 7.3 6 10.5a6 6 0 0 1-12 0C6 10.3 8.5 7.5 12 3z"/>',
 tv:'<rect x="3" y="5" width="18" height="12" rx="2"/><path d="M8 21h8M12 17v4"/>',
 usb:'<path d="M8.5 8V3h7v5M6.5 8h11v6a3 3 0 0 1-3 3h-5a3 3 0 0 1-3-3zM12 17v4"/>',
 inv:'<circle cx="12" cy="12" r="9"/><path d="M7 12c1.5-4 3.5-4 5 0s3.5 4 5 0"/>',
 arrive:'<path d="M12 21s-6-5.5-6-10a6 6 0 0 1 12 0c0 4.5-6 10-6 10z"/><circle cx="12" cy="11" r="2"/>',
 sleep:'<path d="M20 14.500A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',
 away:'<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/>',
 off:'<path d="M12 3v9M6.3 6.3a8 8 0 1 0 11.4 0"/>'};
const ico=k=>`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${IC[k]}</svg>`;
const SCENES=[
  ['arrive','도착','불 켜고 물 준비',{ceil:1,l1:1,l3:1,pump:1,usb:1,fridge:1}],
  ['sleep','취침','조명·TV·펌프 끔',{ceil:0,l1:0,l2:0,l3:0,awning:0,tv:0,pump:0}],
  ['away','외출','냉장고만 남김',{ceil:0,l1:0,l2:0,l3:0,awning:0,tv:0,pump:0,usb:0,inv:0,fridge:1}],
  ['off','모두 끄기','전부 끔',null]];
// [키, 이름, 와트, 지도 x, 지도 y, 지도 모양]
const DEV=[
  ['ceil','천장등',18,440,232],['l1','조명1',8,90,103],
  ['l2','조명2',8,null,null,[{t:'line',x1:60,x2:545,y:68},{t:'line',x1:60,x2:384,y:362}]],
  ['l3','조명3',8,null,null,[{t:'pin',x:182,y:158},{t:'pin',x:432,y:158},{t:'pin',x:182,y:328},{t:'pin',x:432,y:328}]],
  ['awning','어닝등',12,null,null,[{t:'line',x1:280,x2:560,y:405}]],
  ['fridge','냉장고',45,495,103],['pump','물펌프',30,365,103],['tv','TV',40,435,103],['usb','USB',10,245,103],['inv','인버터',25,90,172]];
SCENES[3][3]=Object.fromEntries(DEV.map(d=>[d[0],0]));
const st={sw:{ceil:1,l1:1,fridge:1,usb:1,pump:1},scene:'',arm:0,door:false};
const $=id=>document.getElementById(id);
let tT=0;
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(tT);tT=setTimeout(()=>e.classList.remove('show'),2200)}

function toggle(k){
  const d=DEV.find(x=>x[0]===k),on=!!st.sw[k];
  if(k==='inv'&&!on&&!st.arm){st.arm=1;$('d-inv').classList.add('arm');toast('인버터는 한 번 더 누르면 켜집니다');setTimeout(()=>{st.arm=0;$('d-inv').classList.remove('arm')},4000);return}
  st.arm=0;$('d-inv').classList.remove('arm');st.sw[k]=on?0:1;st.scene='';toast(d[1]+(on?' 껐습니다':' 켰습니다'));render();
}
function run(id){const s=SCENES.find(x=>x[0]===id);Object.assign(st.sw,s[3]);st.scene=id;toast(s[1]+' · '+s[2]);render()}

function build(){
  SCENES.forEach(([id,label])=>{const b=document.createElement('button');b.type='button';b.className='scene';b.id='sc-'+id;b.innerHTML=ico(id)+label;b.onclick=()=>run(id);$('scenes').appendChild(b)});
  const mg=$('mdevs');
  DEV.forEach(([k,n,w,x,y,sh])=>{
    const b=document.createElement('button');b.type='button';b.className='dev';b.id='d-'+k;
    b.innerHTML=`${ico(k)}<span><b>${n}</b><small></small></span>`;b.onclick=()=>toggle(k);$('devs').appendChild(b);
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');g.id='m-'+k;
    g.innerHTML=sh?sh.map(s=>s.t==='line'?`<path class="m-glow" d="M${s.x1} ${s.y} H${s.x2}" stroke="var(--lamp-glow)" stroke-width="30" stroke-linecap="round" fill="none"/><path class="m-bar" d="M${s.x1} ${s.y} H${s.x2}"/>`:`<circle class="m-glow" cx="${s.x}" cy="${s.y}" r="50" fill="url(#glow)"/><circle class="m-dot" cx="${s.x}" cy="${s.y}" r="10"/>`).join('')
      :`<circle class="m-glow" cx="${x}" cy="${y}" r="70" fill="url(#glow)"/><circle class="m-dot" cx="${x}" cy="${y}" r="15"/>`;
    mg.appendChild(g);
  });
  $('doorTile').onclick=()=>{st.door=!st.door;toast('예시: 도어 '+(st.door?'열림':'닫힘')+' · 실제로는 센서가 알려 줍니다');render()};
}

function render(){
  let load=0,n=0;
  DEV.forEach(([k,name,w])=>{const on=!!st.sw[k];if(on){load+=w;n++}
    const b=$('d-'+k);b.setAttribute('aria-pressed',on);b.querySelector('small').textContent=on?`켜짐 · ${w} W`:'꺼짐';
    $('m-'+k).classList.toggle('on',on)});
  SCENES.forEach(([id])=>$('sc-'+id).setAttribute('aria-pressed',st.scene===id));
  const solar=180,net=solar-load,amp=(net/13.2).toFixed(1);
  $('load').textContent=load+' W';$('net').textContent=(net>=0?'+':'')+net+' W';
  const chip=$('flowChip');chip.textContent=net>=0?'충전 중':'방전 중';chip.style.borderColor=chip.style.color=net>=0?'var(--ok)':'var(--warn)';
  $('eta').textContent=net>0?`약 ${Math.round(120/(amp))}시간 뒤 가득 참`:net<0?`이대로면 약 ${Math.round(480/(-amp))}시간 사용`:'변화 없음';
  $('devHead').textContent=n?`${n}개 켜짐 · ${load} W`:'모두 꺼짐';
  $('mapCap').textContent=st.door?'도어 열림':'도어 닫힘';
  const dt=$('doorTile');dt.classList.toggle('open',st.door);$('doorV').textContent=st.door?'열림':'닫힘';$('doorS').textContent=st.door?'눌러서 닫힘으로 (예시)':'눌러서 열림으로 (예시)';
  $('mdoor').classList.toggle('door-open',st.door);
  const al=$('alert');al.classList.toggle('show',st.door);al.innerHTML=st.door?`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 2 20h20zM12 10v4M12 17h.01"/></svg>슬라이드 도어가 열려 있습니다`:'';
}

(()=>{const r=document.documentElement,bs=document.querySelectorAll('.themeBtn');
  const moon='<path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/>',sun='<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>';
  let saved=null;try{saved=localStorage.getItem('ev-theme')}catch(e){}
  let dark=saved?saved==='dark':matchMedia('(prefers-color-scheme: dark)').matches;
  const apply=()=>{r.dataset.theme=dark?'dark':'light';bs.forEach(b=>{b.innerHTML=`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">${dark?sun:moon}</svg>`;b.setAttribute('aria-label',(dark?'라이트':'다크')+' 모드로 전환')})};
  apply();bs.forEach(b=>b.onclick=()=>{dark=!dark;apply();try{localStorage.setItem('ev-theme',dark?'dark':'light')}catch(e){}});
})();
function tab(id){['status','ctrl'].forEach(k=>{const on=k===id;$('tab-'+k).setAttribute('aria-selected',on);$('pane-'+k).hidden=!on})}
$('tab-status').onclick=()=>tab('status');document.querySelectorAll('.soon').forEach(b=>b.onclick=()=>toast(b.dataset.name+' 화면은 다음 시안에서 만듭니다'));$('tab-ctrl').onclick=()=>tab('ctrl');
build();render();if(location.hash==='#control')tab('ctrl');
</script>
</body>
</html>
